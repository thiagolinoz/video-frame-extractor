apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-frame-extractor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-frame-extractor
  template:
    metadata:
      labels:
        app: video-frame-extractor
    spec:
      containers:
        - name: video-frame-extractor
          image: REPO_ECR
          resources:
            requests:
              cpu: "200m" # Solicita 0.2 de um core de CPU (maior que video-app por conta do processamento)
              memory: "512Mi" # Solicita 512 megabytes de memória
            limits:
              cpu: "1000m" # Limite de 1 core de CPU
              memory: "1Gi" # Limite de 1 gigabyte de memória
          ports:
            - containerPort: 8080

          env:
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_ACCESS_KEY_ID # comentar daqui p deploy sem action
              valueFrom:
                secretKeyRef:
                  name: aws-academy-credentials
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-academy-credentials
                  key: secret-access-key
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aws-academy-credentials
                  key: session-token # comentar ate aqui p deploy sem action
#            - name: AWS_ACCESS_KEY_ID
#              value: "ID_DA_TUA_CONTA_ACADEMY"
#            - name: AWS_SECRET_ACCESS_KEY
#              value: "SECRET_DA_TUA_CONTA_ACADEMY"
#            - name: AWS_SESSION_TOKEN
#              value: "TOKEN_DA_TUA_CONTA_ACADEMY"

          envFrom:
            - configMapRef:
                name: video-frame-extractor-config

          # # Volume para armazenar arquivos temporários
          # volumeMounts:
          #   - name: temp-storage
          #     mountPath: /app/temp
          #   - name: output-storage
          #     mountPath: /app/output

          # # Readiness probe para garantir que o pod está pronto
          # readinessProbe:
          #   httpGet:
          #     path: /actuator/health
          #     port: 8080
          #   initialDelaySeconds: 30
          #   periodSeconds: 10
          #   failureThreshold: 3

          # # Liveness probe para garantir que o pod está funcionando
          # livenessProbe:
          #   httpGet:
          #     path: /actuator/health
          #     port: 8080
          #   initialDelaySeconds: 60
          #   periodSeconds: 30
          #   failureThreshold: 3

      volumes:
        - name: temp-storage
          emptyDir: {}
        - name: output-storage
          emptyDir: {}
