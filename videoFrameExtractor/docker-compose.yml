version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videoframeextractor-app
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_OPTS: -Xmx512m -Xms256m
    ports:
      - "8080:8080"
    volumes:
      - app_temp:/app/temp
      - app_output:/app/output
      - app_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      timeout: 5s
      retries: 5
      interval: 30s
      start_period: 60s

volumes:
  app_temp:
    driver: local
  app_output:
    driver: local
  app_logs:
    driver: local

