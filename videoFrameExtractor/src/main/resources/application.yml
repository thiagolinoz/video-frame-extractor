spring:
  profiles:
    active: local
  application:
    name: video-frame-extractor

# Kafka Configuration (conforme diagrama)
kafka:
  enabled: true
  bootstrap-servers: 54.172.160.122:9094  # Mesmo servidor do video-app
  consumer:
    group-id: video-frame-extractor-group
    auto-offset-reset: earliest
    enable-auto-commit: false
  producer:
    retries: 3
    acks: all
  topics:
    process-status: process-status-videos

# AWS S3 Configuration (conforme diagrama)
app:
  aws:
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
    region: ${AWS_REGION:us-east-1}
    s3:
      enabled: true
      bucket-name: postech-fiap-bucket-videos-fase5  # Mesmo bucket do video-app
      videos-prefix: videos/
      frames-prefix: frames/
      endpoint: ${AWS_S3_ENDPOINT:}
      path-style-access: false

# Logging
logging:
  level:
    com.summitbra.videoframeextractor: INFO
    org.springframework.kafka: ERROR
    com.amazonaws: WARN

# Server configuration
server:
  port: 8085  # Diferente do video-app (8080)

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

---
# Local development profile
spring:
  config:
    activate:
      on-profile: local

kafka:
  bootstrap-servers: localhost:9092

app:
  aws:
    s3:
      endpoint: http://localhost:4566
      path-style-access: true

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod

kafka:
  enabled: true
  bootstrap-servers: 54.172.160.122:9094

app:
  aws:
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    s3:
      bucket-name: postech-fiap-bucket-videos-fase5
      path-style-access: false
