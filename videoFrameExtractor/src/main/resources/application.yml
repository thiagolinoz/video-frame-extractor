spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  application:
    name: video-frame-extractor
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:videoframeextractor;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

# Kafka Configuration
kafka:
  enabled: false  # Definir como true quando Kafka estiver disponível
  bootstrap-servers: localhost:9092
  consumer:
    group-id: video-frame-extractor-group
    auto-offset-reset: earliest
  producer:
    retries: 3
    acks: all
  topics:
    received-videos: received-videos
    process-status: process-status-videos

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  info:
    title: Video Frame Extractor API
    description: API para extração de frames de vídeos
    version: 1.0.0
  servers:
    - url: http://localhost:8080
      description: Development server



server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css

app:
  video:
    temp-dir: temp
    output-dir: output
  storage:
    base-path: storage
    videos-bucket: bucket-videos
    frames-bucket: bucket-videos
  ffmpeg:
    path: ffmpeg
    fallback-enabled: true
  ffprobe:
    path: ffprobe
  cleanup:
    enabled: true
    cron: "0 0 2 * * ?"  # 2AM todos os dias

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.summitbra.videoframeextractor: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/video-frame-extractor.log

